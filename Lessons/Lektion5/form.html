<!DOCTYPE html>
<html lang="en">
    <head>
        <!--Webbsida-->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Formulär</title>
    </head>
    <body>
        <section>
            <form action="#" method="post">
                <!--Skrivfält för Förnamn.-->
                <label for="namn1"> Förnamn:</label>
                <input type="text" id="namn1" name="namn1" placeholder="Förnamn"><br>

                <!--Skrivfält för Efternamn.-->
                <label for="namn2"> Efternamn:</label>
                <input type="text" id="namn2" name="namn2" placeholder="Efternamn"><br>

                <!--Skrivfält för E-post.-->
                <label for="email"> E-post:</label>
                <input type="email" id="email" name="email" placeholder="E-post"><br>

                <!--Knapp för att skicka in.-->
                <button type="submit">Skicka</button>
            </form>
        </section>
    </body>
</html>
