	<style>
		:root {
			color-scheme: light;
			--ink: #17212b;
			--muted: #5c6b78;
			--paper: #f7f4ee;
			--panel: #ffffff;
			--line: #ded8cd;
			--accent: #c64b36;
			--accent-dark: #8e3023;
		}

		* { box-sizing: border-box; }

		body {
			margin: 0;
			color: var(--ink);
			background: var(--paper);
			font-family: Georgia, "Times New Roman", serif;
			line-height: 1.5;
		}

		header {
			padding: 4rem 1.5rem 3rem;
			background: var(--ink);
			color: #fffaf2;
		}

		header div, main { max-width: 980px; margin: 0 auto; }

		.eyebrow {
			margin: 0 0 .5rem;
			color: #f2a18e;
			font: 700 .78rem/1.2 Arial, sans-serif;
			letter-spacing: .14em;
			text-transform: uppercase;
		}

		h1, h2, p { margin-top: 0; }
		h1 { max-width: 700px; margin-bottom: .75rem; font-size: clamp(2.5rem, 7vw, 5.5rem); line-height: .95; }
		header p { max-width: 580px; margin-bottom: 0; color: #d9e0e3; font-size: 1.1rem; }

		main { padding: 2rem 1.5rem 4rem; }

		.intro {
			margin-bottom: 1.5rem;
			color: var(--muted);
			font-size: 1.05rem;
		}

		.lesson-status {
			color: var(--muted);
			font: .9rem Arial, sans-serif;
		}

		.lessons {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
			gap: 1rem;
		}

		section {
			padding: 1.35rem;
			background: var(--panel);
			border: 1px solid var(--line);
			border-top: 5px solid var(--accent);
		}

		.project-card {
			border-top-color: #356b60;
		}

		h2 { margin-bottom: .15rem; font-size: 1.45rem; }
		.folder { margin-bottom: 1rem; color: var(--muted); font: .82rem/1.3 Consolas, monospace; overflow-wrap: anywhere; }

		ul { margin: 0; padding: 0; list-style: none; }
		li { overflow-wrap: anywhere; }
		li + li { margin-top: .55rem; }

		a {
			color: var(--accent-dark);
			font-weight: 700;
			text-decoration-thickness: 1px;
			text-underline-offset: 3px;
		}

		a:hover, a:focus { color: var(--accent); }
		.file-type { color: var(--muted); font: .78rem Arial, sans-serif; }

		footer {
			max-width: 980px;
			margin: 0 auto;
			padding: 0 1.5rem 2rem;
			color: var(--muted);
			font: .85rem Arial, sans-serif;
		}

		.footer-meta {
			display: flex;
			align-items: center;
			gap: .65rem;
			flex-wrap: wrap;
		}

		.footer-copy {
			display: flex;
			flex-direction: column;
			gap: .15rem;
		}

		.views {
			display: inline-flex;
			align-items: center;
			gap: .45rem;
			padding: .25rem .55rem;
			border: 1px solid var(--line);
			border-radius: 999px;
			background: #fff;
			color: var(--ink);
			font-weight: 700;
		}

		.eye {
			font-size: 1rem;
			line-height: 1;
		}
	</style>
</head>
<body>
	<header>
		<div>
			<p class="eyebrow">Webbutveckling</p>
			<h1>Alla lektioner och projekt på ett ställe.</h1>
			<p>En samlad startsida för projektets HTML-sidor, bilder, ljud och video.</p>
		</div>
	</header>

	<main>
		<p class="intro">Välj en mapp och öppna en fil. Mappar och filer hämtas automatiskt från GitHub.</p>
		<p class="lesson-status" id="lesson-status" role="status" aria-live="polite">Laddar mappar…</p>

		<div class="lessons"></div>
	</main>

	<footer>
		<div class="footer-meta">
			<span class="views" aria-label="Antal aktiva visningar">
				<span class="eye" aria-hidden="true">👁</span>
				<span id="view-count">1</span>
			</span>
			<div class="footer-copy">
				<span>Webbutveckling · @FOrt404 · GitHub Pages</span>
				<span id="last-updated">Senast uppdaterad: --</span>
			</div>
		</div>
	</footer>

	<script>
		(async function () {
			const grid = document.querySelector('.lessons');
			const status = document.getElementById('lesson-status');

			try {
				const response = await fetch('https://api.github.com/repos/FOrt304/Webbutveckling/git/trees/main?recursive=1', {
					cache: 'no-store',
					headers: { Accept: 'application/vnd.github+json' }
				});
				if (!response.ok) throw new Error('GitHub API returned ' + response.status);

				const tree = await response.json();
				if (tree.truncated) throw new Error('GitHub returned an incomplete file tree');

				const folderFiles = new Map();
				for (const item of tree.tree) {
					if (item.type !== 'blob') continue;
					const separator = item.path.indexOf('/');
					if (separator === -1) continue;

					const folder = item.path.slice(0, separator);
					if (folder.toLowerCase() === '.github') continue;
					if (!folderFiles.has(folder)) folderFiles.set(folder, []);
					folderFiles.get(folder).push(item.path);
				}

				const cards = Array.from(folderFiles, function ([folder, files]) {
					const section = document.createElement('section');
					if (/^(projekt|projects?)$/i.test(folder)) section.classList.add('project-card');
					const heading = document.createElement('h2');
					heading.textContent = folder.replace(/([a-z])(\d)/i, '$1 $2');

					const folderLabel = document.createElement('p');
					folderLabel.className = 'folder';
					folderLabel.textContent = folder + '/';

					const list = document.createElement('ul');
					files.sort(function (a, b) {
						return a.localeCompare(b, 'sv', { numeric: true });
					});
					for (const file of files) {
						const relativePath = file.slice(folder.length + 1);
						const item = document.createElement('li');
						const link = document.createElement('a');
						link.href = file.split('/').map(encodeURIComponent).join('/');
						link.textContent = relativePath;

						const extension = relativePath.includes('.')
							? relativePath.split('.').pop().toUpperCase()
							: 'FIL';
						const type = document.createElement('span');
						type.className = 'file-type';
						type.textContent = extension;

						item.append(link, ' ', type);
						list.append(item);
					}

					section.append(heading, folderLabel, list);
					return section;
				}).sort(function (a, b) {
					return a.querySelector('h2').textContent.localeCompare(b.querySelector('h2').textContent, 'sv', { numeric: true });
				});

				grid.replaceChildren(...cards);
				status.textContent = cards.length ? '' : 'Inga mappar hittades i projektet.';
			} catch (error) {
				console.error('Kunde inte ladda mappar från GitHub:', error);
				status.textContent = 'Kunde inte ladda mappar automatiskt från GitHub.';
			}
		})();
	</script>

	<script type="module">
		import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js';
		import { getAuth, signInAnonymously } from 'https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js';
		import { getDatabase, onDisconnect, onValue, ref, remove, set } from 'https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js';

		const firebaseConfig = {
			apiKey: 'AIzaSyDN80yxHiKPTcTr_3o5HrjMdKGqJ9sFVYU',
			authDomain: 'webbutveckling-fort404.firebaseapp.com',
			databaseURL: 'https://webbutveckling-fort404-default-rtdb.europe-west1.firebasedatabase.app/',
			projectId: 'webbutveckling-fort404',
			storageBucket: 'webbutveckling-fort404.firebasestorage.app',
			messagingSenderId: '285209919641',
			appId: '1:285209919641:web:c475560e54281921153808',
			measurementId: 'G-M80EG64CP5'
		};

		(function () {
			const countEl = document.getElementById('view-count');
			const updatedEl = document.getElementById('last-updated');
			const metaDescription = document.querySelector('meta[name="description"]');
			const ogDescription = document.querySelector('meta[property="og:description"]');
			const app = initializeApp(firebaseConfig);
			const auth = getAuth(app);
			const database = getDatabase(app);

			signInAnonymously(auth).then(function (userCredential) {
				const presenceRef = ref(database, 'activeViews/' + userCredential.user.uid + '_' + crypto.randomUUID());
				return onDisconnect(presenceRef).remove().then(function () {
					return set(presenceRef, true);
				}).then(function () {
					onValue(ref(database, 'activeViews'), function (snapshot) {
						if (countEl) countEl.textContent = (snapshot.size || 0).toLocaleString('sv-SE');
					});
					window.addEventListener('beforeunload', function () {
						remove(presenceRef);
					});
				});
			}).catch(function (error) {
				console.error('Firebase active view counter failed:', error);
				if (countEl) countEl.textContent = '1';
			});

			if (updatedEl) {
				const now = new Date();
				const formatted = new Intl.DateTimeFormat('sv-SE', {
					day: 'numeric',
					month: 'long',
					year: 'numeric',
					hour: '2-digit',
					minute: '2-digit'
				}).format(now);
				updatedEl.textContent = 'Senast uppdaterad: ' + formatted;
				const summaryText = 'Alla lektioner och filer i Alexander Lundbergs webbutvecklingsprojekt. Senast uppdaterad: ' + formatted + '.';
				if (metaDescription) metaDescription.setAttribute('content', summaryText);
				if (ogDescription) ogDescription.setAttribute('content', summaryText);
			}
		})();
	</script>
</body>
</html>
